name: Crawl news

# File renamed from crawl.yml -> news-crawl.yml on 2026-09-15: the
# schedule trigger had gone stale (no automatic run for ~6h after a
# cron edit) and disabling+re-enabling the workflow in the UI didn't
# clear it. Renaming makes GitHub register a brand-new workflow ID,
# which sidesteps whatever internal state the old one was stuck in —
# a workaround reported to work elsewhere when disable/enable doesn't.
#
# GitHub Actions runners are ephemeral — each run starts from a fresh
# checkout of `main`, so data/news.db (the SQLite dedup state) has to
# survive somewhere between runs, or the app would treat every article
# as "new" again next time and flood Telegram.
#
# The database lives on a dedicated orphan branch (DB_BRANCH below),
# completely separate from `main`. `main` only ever receives normal
# commits (your own code pushes) and this workflow never touches it.
# The db branch is rewritten (force-pushed) as a single commit every
# run — nobody reads its history, so there is nothing to preserve, and
# this keeps the repo from accumulating ~96 junk commits/day.
#
# (An earlier version of this workflow force-pushed the db commit onto
# `main` itself, amending in place. That was switched to a separate
# branch after `main`'s scheduled `cron` trigger mysteriously stopped
# firing — force-rewriting the default branch's tip on every run is
# not a normal repo access pattern, and cron silently going stale
# afterward lines up with that. Undocumented by GitHub either way, but
# keeping `main` untouched removes the suspicion entirely.)
#
# Flat cadence, around the clock (mirrors config.py's
# crawl_interval_minutes=20 default — keep in sync if you change
# either). GitHub Actions cron is UTC-only, but "every 20 minutes"
# needs no timezone conversion since it applies to every hour equally.
"on":
  schedule:
    - cron: "*/20 * * * *" # every 20 min, all day
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

env:
  DB_BRANCH: db-state

# Only one crawl at a time: if a run is still going when the next
# scheduled trigger fires (e.g. a slow source), queue instead of
# overlapping — two runs racing to push db-state would conflict.
concurrency:
  group: news-crawl
  cancel-in-progress: false

permissions:
  contents: write # required to push the db-state branch
  pages: write # required to deploy the static site to GitHub Pages
  id-token: write # required by actions/deploy-pages for its OIDC token

jobs:
  crawl:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        # Only `main` (code) is checked out into the working tree;
        # db-state is fetched as a ref below without switching branches,
        # so this job never runs `git checkout` away from `main`.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database from db-state branch
        run: |
          if git ls-remote --exit-code --heads origin "$DB_BRANCH" > /dev/null 2>&1; then
            git fetch --depth 1 origin "$DB_BRANCH"
            git show "origin/$DB_BRANCH:data/news.db" > data/news.db
            echo "Restored data/news.db from $DB_BRANCH."
          else
            echo "$DB_BRANCH doesn't exist yet — first run, starting empty."
          fi

      - name: Run one crawl cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --run-once

      - name: Push updated database to db-state branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Plumbing commands build the new commit directly from the
          # blob, without touching the `main` working tree/index at
          # all — no checkout, no branch switch in this job.
          BLOB=$(git hash-object -w data/news.db)
          DATA_TREE=$(printf '100644 blob %s\tnews.db\n' "$BLOB" | git mktree)
          ROOT_TREE=$(printf '040000 tree %s\tdata\n' "$DATA_TREE" | git mktree)
          COMMIT=$(git commit-tree "$ROOT_TREE" -m "chore: update news database [bot]")
          git push --force origin "$COMMIT:refs/heads/$DB_BRANCH"

      - name: Generate static site (multi-day archive)
        run: python -m web.generate_site

      - name: Upload site to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@v4
